<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>환율 정보</title>
  <link rel="stylesheet" th:href="@{/css/exchange.css}">
</head>
<body>
  <div class="page">

    <div class="page-header">
      <h1>환율 정보</h1>
      <span class="badge-live">실시간</span>
    </div>

    <div class="calc-grid">

      <!-- ================= 환율계산기 ================= -->
      <div class="card">
        <div class="card-title-row">
          <span class="card-title">🧮 환율계산기</span>
          <span class="badge-basis">매매기준율 적용</span>
        </div>

        <!-- 방향 토글: 페이지 이동 없이 JS가 active 클래스만 바꿔서 계산 방향을 전환함 -->
        <div class="direction-toggle">
          <button type="button" id="dir-to-krw" class="active">외화 → 원화(KRW)</button>
          <button type="button" id="dir-to-foreign">원화(KRW) → 외화</button>
        </div>

        <label class="calc-label">통화 선택</label>
        <!-- option 4개 고정. exchange.js는 여기에 옵션을 추가하지 않고 표에서 환율값만 읽어감 -->
        <select id="calc-currency-select" class="calc-select">
          <option value="USD">USD</option>
          <option value="JPY(100)">JPY</option>
          <option value="EUR">EUR</option>
          <option value="CNH">CNH</option>
        </select>

        <label class="calc-label">금액 입력 (해당 통화 기준)</label>
        <input type="number" id="calc-amount" class="calc-input" placeholder="숫자만 입력">

        <button type="button" id="calc-btn" class="calc-btn">🧮 계산</button>

        <p class="rate-hint" id="rate-hint">통화를 선택하면 기준환율이 표시됩니다.</p>
      </div>

      <!-- ================= 변환된 가격 ================= -->
      <div class="card">
        <div class="card-title-row">
          <span class="card-title">💰 변환된 가격</span>
        </div>

        <div class="result-amount-box">
          <div class="result-amount-label">환산 금액</div>

          <p class="result-placeholder" id="result-placeholder">왼쪽에서 통화와 금액을 입력하고 계산해 보세요.</p>

          <div id="result-box" class="hidden">
            <span class="result-amount" id="result-amount">0</span>
            <span class="result-amount-unit" id="result-unit">원 (KRW)</span>
          </div>
        </div>

        <div class="result-meta-row">
          <strong id="result-meta"></strong>
        </div>
      </div>
    </div>

    <!-- ================= 환율 시세 정보 ================= -->
    <div class="card market-card">
      <div class="card-title-row">
        <span class="card-title">📈 환율 시세 정보</span>
      </div>
      <p class="market-sub">한국수출입은행 기준, 오늘(<span th:text="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"></span>) 매매기준율 정보입니다.</p>

      <div th:if="${#lists.isEmpty(exchangeList)}" class="empty">
        조회된 환율 데이터가 없습니다.
      </div>

      <table th:if="${not #lists.isEmpty(exchangeList)}">
        <thead>
          <tr>
            <th>통화명</th>
            <th>매매기준율</th>
            <th>현찰 살 때</th>
            <th>현찰 팔 때</th>
            <th>조회일자</th>
          </tr>
        </thead>
        <tbody>
          <!-- data-code/data-rate: 계산기의 rateMap이 여기서 값을 읽어감 -->
          <tr th:each="item : ${exchangeList}"
              th:attr="data-code=${item.통화코드},data-rate=${item.매매기준율}">
            <td>
              <div class="currency-cell">
                <span class="currency-badge"
                      th:text="${#strings.substring(item.통화코드, 0, 2)}"
                      th:style="${'background:' + (item.통화코드 == 'USD' ? '#eff6ff;color:#2563eb' : (item.통화코드 == 'EUR' ? '#eef2ff;color:#4f46e5' : (item.통화코드 == 'JPY(100)' ? '#fef2f2;color:#dc2626' : '#f0fdf4;color:#16a34a')))}">US</span>
                <div>
                  <div class="currency-name" th:text="${item.통화명}">미국 달러</div>
                  <div class="currency-code-sub" th:text="${item.통화코드}">USD</div>
                </div>
              </div>
            </td>
            <td class="rate-strong" th:text="${#numbers.formatDecimal(item.매매기준율, 0, 'COMMA', 2, 'POINT')}">1,342.50</td>
            <td th:text="${#numbers.formatDecimal(item.살때, 0, 'COMMA', 2, 'POINT')}">1,365.99</td>
            <td th:text="${#numbers.formatDecimal(item.팔때, 0, 'COMMA', 2, 'POINT')}">1,319.01</td>
            <td th:text="${item.조회일자}">2026-09-15</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script th:src="@{/js/exchange.js}"></script>
</body>
</html>
